# =============================================================================
# Nginx reverse proxy configuration for the compose_app module
#
# Purpose:
# - Expose a single public HTTP entry point
# - Forward incoming requests to the internal Flask web service
# - Demonstrate service-to-service communication via Docker DNS
#
# Key concepts:
# - Reverse proxy pattern
# - Internal Docker networking
# - Service discovery using Compose service names
# - Separation between external access and backend services
#
# In Docker Compose:
# - proxy service listens publicly on port 80
# - web service listens internally on port 5000
#
# Because both services share the frontend network, nginx can reach:
#   http://web:5000
#
# "web" is resolved automatically by Docker's built-in DNS.
# =============================================================================



server {

    # -------------------------------------------------------------------------
    # Listen on container port 80
    #
    # External host access is controlled by compose.yaml:
    # ports:
    #   - "${PROXY_PORT}:80"
    # -------------------------------------------------------------------------
    listen 80;

    # Default hostname
    server_name localhost;

    # -------------------------------------------------------------------------
    # Main application route
    #
    # All incoming requests are forwarded to the Flask service.
    # -------------------------------------------------------------------------
    location / {

        # Forward traffic to the internal web service
        proxy_pass http://web:5000;

        # ---------------------------------------------------------------------
        # Forward useful HTTP headers
        #
        # These help backend applications:
        # - Identify original client IP
        # - Preserve original host
        # - Preserve forwarding chain
        # ---------------------------------------------------------------------
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    }

    # -------------------------------------------------------------------------
    # Health endpoint
    #
    # Allows direct proxy health validation.
    # Useful for:
    # - Testing nginx itself
    # - Troubleshooting proxy issues independently of Flask
    # -------------------------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "nginx healthy\n";
    }

}