# =============================================================================
# Docker Compose — COGSI / Containerization Part II
# -----------------------------------------------------------------------------
# Purpose:
# - Understand declarative multi-container orchestration
# - Understand service separation and single responsibility
# - Understand networking via service names
# - Understand persistent storage with volumes
# - Understand environment variable substitution with .env
# - Understand health checks and startup dependencies
#
# Directory structure:
#   .
#   ├── compose.yaml
#   ├── .env.example
#   ├── .gitignore
#   ├── web/
#   │   ├── Dockerfile
#   │   ├── .dockerignore
#   │   ├── requirements.txt
#   │   └── app.py
#   └── nginx/
#       └── default.conf
#
# Before starting the stack, copy .env.example to .env
# The local .env file is excluded from version control
# -----------------------------------------------------------------------------


# =============================================================================
# SERVICES
#
# Each service defines one container role within the application stack.
#
# In this example:
# - proxy  -> Reverse proxy / frontend entry point
# - web    -> Main Flask application
# - redis  -> Backend cache / state service
#
# Each service can:
# - Pull an existing image
# - Build a local image
# - Mount volumes
# - Join one or more networks
# - Define environment variables
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy service
  #
  # Purpose:
  # - Accept incoming HTTP traffic from the host
  # - Forward requests internally to the web service
  #
  # Key concepts:
  # - Official image usage
  # - Port publishing
  # - Bind mounts for configuration
  # - Health-based dependency management
  #
  # Notes:
  # - This is the only externally exposed service
  # - web is intentionally hidden behind proxy
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:stable-alpine

    # Publish host port -> container port
    # Value comes from .env file (PROXY_PORT=8080)
    ports:
      - "${PROXY_PORT}:80"

    # Mount custom Nginx config from host to container (:ro = read-only)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    # Wait until web service is healthy
    depends_on:
      web:
        condition: service_healthy

    # Connect only to frontend network
    networks:
      - frontend

    # Restart automatically unless explicitly stopped
    restart: unless-stopped


  # ---------------------------------------------------------------------------
  # Main application service
  #
  # Purpose:
  # - Runs the Flask application built locally from source
  #
  # Key concepts:
  # - Local Dockerfile build
  # - .env variable substitution
  # - Named volumes
  # - Multi-network connectivity
  # - Health checks
  #
  # Notes:
  # - This service bridges frontend and backend
  # - It communicates with redis using service DNS name "redis"
  # ---------------------------------------------------------------------------
  web:

    # Build image dynamically from ./web directory
    build: ./web

    # Runtime environment variables
    environment:
      - APP_VERSION=${APP_VERSION}
      - REDIS_HOST=redis

    # Persistent application data
    volumes:
      - web-data:/data

    # Wait for redis to become healthy
    depends_on:
      redis:
        condition: service_healthy

    # Connect to both frontend and backend
    networks:
      - frontend
      - backend

    # Health check endpoint
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped


  # ---------------------------------------------------------------------------
  # Redis backend service
  #
  # Purpose:
  # - Provides persistent key-value storage
  #
  # Key concepts:
  # - Official image
  # - Command override
  # - Persistent named volume
  # - Internal-only networking
  #
  # Notes:
  # - No host port exposure
  # - Only web can access redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine

    # Enable append-only persistence
    command: redis-server --appendonly yes

    # Persist redis data
    volumes:
      - redis-data:/data

    # Internal backend only
    networks:
      - backend

    # Verify service readiness
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped


# =============================================================================
# NETWORKS
#
# Networks define communication boundaries between services.
#
# frontend:
# - proxy <-> web
#
# backend:
# - web <-> redis
#
# Security principle:
# - proxy cannot directly access redis
# - redis is isolated from external traffic
# =============================================================================
networks:

  frontend:
    driver: bridge

  backend:
    driver: bridge


# =============================================================================
# VOLUMES
#
# Named volumes provide persistent Docker-managed storage.
#
# web-data:
# - Application-generated persistent files
#
# redis-data:
# - Redis append-only data
#
# These volumes survive container recreation.
# =============================================================================
volumes:

  web-data:

  redis-data:



# =============================================================================
# BASIC WORKFLOW
# =============================================================================
#
# Start all services:
#
#   docker compose up
#
# Rebuild local images and start all services:
#
#   docker compose up --build
#
# Run detached:
#
#   docker compose up -d
#
# Rebuild images and run detached:
#
#   docker compose up --build -d
# =============================================================================


# =============================================================================
# VALIDATION / DEBUGGING
# =============================================================================
#
# Validate the Compose file and resolve configuration variables:
#
#   docker compose config
#
# View service status:
#
#   docker compose ps
#
# View logs from all services:
#
#   docker compose logs
#
# Follow application logs:
#
#   docker compose logs -f web
#
# Follow logs from all services:
#
#   docker compose logs -f
#
# Open a shell in the web container:
#
#   docker compose exec web sh
#
# Check service health and startup status:
#
#   docker compose ps
#
# =============================================================================


# =============================================================================
# TESTING
# =============================================================================
#
# Access the application through Nginx:
#
#   curl http://localhost:8080
#
# Check application health through Nginx:
#
#   curl -i http://localhost:8080/health
#
# Check Redis connectivity:
#
#   docker compose exec redis redis-cli ping
#
# Expected Redis response:
#
#   PONG
#
# Check the visit counter stored in Redis:
#
#   docker compose exec redis redis-cli GET visits
#
# Send multiple requests to increment the counter:
#
#   curl -s http://localhost:8080
#   curl -s http://localhost:8080
#   curl -s http://localhost:8080
#
# Read the counter again and verify that it has increased:
#
#   docker compose exec redis redis-cli GET visits
#
# Inspect the application access log:
#
#   docker compose exec web cat /data/access.log
#
# Check Nginx health:
#
#   curl -i http://localhost:8080/nginx-health
#
# =============================================================================


# =============================================================================
# CLEANUP
# =============================================================================
#
# Stop and remove containers and networks:
#
#   docker compose down
#
# Stop and remove containers, networks, and named volumes:
# WARNING: this also deletes persistent application and Redis data.
#
#   docker compose down -v
# =============================================================================